name: Set up Supabase backend
# Run this from the Actions tab ("Run workflow") after adding the secrets below. Safe to run again: migrations are tracked.
# Secrets: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens), SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
#          SUPABASE_DB_URL (Dashboard > Connect > "Session pooler" URI, with your password filled in),
#          RESEND_API_KEY, CRON_SECRET and TAKEDOWN_SECRET (any long random strings), SITE_URL (https://pinboard.tcqindia.com).
on:
  workflow_dispatch:
    inputs:
      make_admin_email:
        description: 'Optional: email of a signed-up user to make the admin'
        required: false
        default: ''
      deploy_functions:
        description: 'Deploy edge functions and secrets'
        type: boolean
        default: true
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Link project and apply migrations (schema, RLS, storage, cron)
        run: |
          supabase link --project-ref "$REF"
          supabase db push --yes
      - name: Edge function secrets and deploy
        if: inputs.deploy_functions
        run: |
          supabase secrets set --project-ref "$REF" \
            RESEND_API_KEY='${{ secrets.RESEND_API_KEY }}' CRON_SECRET='${{ secrets.CRON_SECRET }}' TAKEDOWN_SECRET='${{ secrets.TAKEDOWN_SECRET }}' \
            SITE_URL='${{ secrets.SITE_URL }}' FROM_EMAIL='Pin Board <pinboard@tcqindia.com>' REPLY_TO='thecuriosityquotient@gmail.com'
          for f in send-emails takedown retention; do supabase functions deploy "$f" --project-ref "$REF" --no-verify-jwt; done
      - name: Tell the database where the functions live
        if: inputs.deploy_functions
        env: { DB: '${{ secrets.SUPABASE_DB_URL }}' }
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "select set_edge_config('https://${REF}.supabase.co/functions/v1', '${{ secrets.CRON_SECRET }}')"
      - name: Make admin
        if: inputs.make_admin_email != ''
        env: { DB: '${{ secrets.SUPABASE_DB_URL }}', EMAIL: '${{ inputs.make_admin_email }}' }
        run: psql "$DB" -v ON_ERROR_STOP=1 -v e="$EMAIL" -c "update profiles set role='admin', status='approved' where email = lower(:'e')" 
