name: CI
on:
  pull_request:
  push:
    branches: [main, claude/lucid-lamport-j3x023]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  api-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - name: Install Postgres 16
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm ci
        working-directory: api
      - run: npm run typecheck
        working-directory: api
      - name: Database tests (RLS, roles, cap, queue, expiry)
        run: sudo bash db/tests/run_local.sh
      - name: API tests (sign-in, uploads, queue, emails, take-down link)
        run: sudo env "PATH=$PATH" bash api/test/run.sh
      - name: Worker bundles for Cloudflare
        working-directory: api
        run: mkdir -p ../web/dist && echo '<!doctype html>' > ../web/dist/index.html && npx wrangler deploy --dry-run --config ../wrangler.toml --outdir /tmp/worker-out
