# Render Blueprint: one-click free static hosting of the website (alternative to Cloudflare Pages).
# render.com -> New -> Blueprint -> pick this repo. Add the two VITE_ values (or leave empty for demo mode).
services:
  - type: web
    runtime: static
    name: pin-board
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
